fallback_answer: "暂时没有找到合适答案。你可以输入“帮助”查看可提问的问题。"
empty_answer: "请发送具体问题，我会尽量回答。"
help_answer: "你可以问：如何新增笔记、如何修改笔记、如何查询笔记列表、如何查看笔记内容、身份校验。"
items:
  - question: "如何修改FAQ"
    keywords:
      - "FAQ"
      - "配置"
      - "修改问题"
    answer: "编辑 config/faq.yaml，新增 question、keywords 和 answer 后重启机器人即可。"
  - question: "如何新增笔记"
    keywords:
      - "新增笔记"
      - "创建笔记"
      - "写笔记"
    answer: "发送：新增笔记 标题：Git 内容：这里是笔记内容。机器人会在 NOTE_ROOT 目录下创建 Git.md。"
  - question: "如何修改笔记"
    keywords:
      - "修改笔记"
      - "追加笔记"
      - "更新笔记"
    answer: "发送：修改笔记 标题：Git 内容：这里是追加内容。机器人只会追加到已有笔记末尾，不会覆盖原内容。"
  - question: "如何查询笔记列表"
    keywords:
      - "笔记列表"
      - "查询笔记列表"
      - "列出笔记"
    answer: "发送：笔记列表。机器人会返回 NOTE_ROOT 目录下已有的 Markdown 笔记名称。"
  - question: "如何查看笔记内容"
    keywords:
      - "查看笔记"
      - "查询笔记"
      - "笔记内容"
    answer: "发送：查看笔记：Git。机器人会读取 NOTE_ROOT 目录下的 Git.md 内容；内容过长时会截断显示。"
  - question: "笔记保存在哪里"
    keywords:
      - "笔记目录"
      - "保存位置"
      - "NOTE_ROOT"
    answer: "笔记保存在环境变量 NOTE_ROOT 指向的目录下，只允许写入该目录内的 Markdown 文件。"
  - question: "身份校验"
    keywords:
      - "权限"
      - "身份验证"
      - "用户校验"
    answer: "笔记功能已启用用户ID白名单。请在 .env 中配置 NOTE_ALLOWED_USER_IDS，多个用户ID用英文逗号分隔。"
