fallback_answer: "暂时没有找到合适答案。你可以输入“帮助”查看可提问的问题。"
empty_answer: "请发送具体问题，我会尽量回答。"
help_answer: "发送：帮助。机器人会显示可点击的功能菜单；也可以发送：帮助 笔记、帮助 部落冲突、帮助 鸣潮、帮助 权限、帮助 FAQ。"
items:
  - question: "如何修改FAQ"
    keywords:
      - "FAQ"
      - "配置"
      - "修改问题"
    answer: "编辑 config/faq.yaml，新增 question、keywords 和 answer 后重启机器人即可。"
  - question: "如何新增笔记"
    keywords:
      - "新增笔记"
      - "创建笔记"
      - "写笔记"
    answer: "笔记 admin 或全局 owner 可发送：新笔记：Git 这里是笔记内容。也可以发送完整格式：新增笔记 标题：Git 内容：这里是笔记内容。机器人会在 NOTE_ROOT 目录下创建 Git.md。"
  - question: "如何修改笔记"
    keywords:
      - "修改笔记"
      - "追加笔记"
      - "更新笔记"
    answer: "笔记 admin 或全局 owner 可发送：改笔记：Git 这里是追加内容。也可以发送完整格式：修改笔记 标题：Git 内容：这里是追加内容。机器人只会追加到已有笔记末尾，不会覆盖原内容。"
  - question: "如何查询笔记列表"
    keywords:
      - "笔记列表"
      - "查询笔记列表"
      - "列出笔记"
    answer: "发送：笔记列表。机器人会返回 NOTE_ROOT 目录下已有的 Markdown 笔记名称。"
  - question: "如何查看笔记内容"
    keywords:
      - "查看笔记"
      - "查询笔记"
      - "笔记内容"
    answer: "发送：看笔记：Git。也可以发送：查看笔记：Git。机器人会读取 NOTE_ROOT 目录下的 Git.md 内容；内容过长时会截断显示。"
  - question: "笔记保存在哪里"
    keywords:
      - "笔记目录"
      - "保存位置"
      - "NOTE_ROOT"
    answer: "笔记保存在环境变量 NOTE_ROOT 指向的目录下，只允许写入该目录内的 Markdown 文件。"
  - question: "身份校验"
    keywords:
      - "权限"
      - "身份验证"
      - "用户校验"
    answer: "机器人使用四层身份权限：owner、admin、user、guest。初始 owner 在 .env 的 BOT_OWNER_USER_IDS 中配置，功能权限会保存到 AUTH_CONFIG_PATH 指向的 YAML 文件；QQ 会话默认用中文功能名。"
  - question: "身份权限"
    keywords:
      - "四层权限"
      - "owner"
      - "admin"
    answer: "可识别用户未配置时默认是各功能的 user，且不会自动写入 auth.yaml；owner 可使用所有功能并设置任意权限；admin 可使用对应功能并把其他用户设为 user 或 guest；显式 guest 不可使用对应功能，unknown 用户会被拒绝。共享笔记写入仅限笔记 admin 或全局 owner。"
  - question: "查看我的ID"
    keywords:
      - "我的ID"
      - "用户ID"
      - "openid"
    answer: "发送：查看我的ID。机器人会返回当前 QQ 消息事件中的用户 ID/openid，用于配置 BOT_OWNER_USER_IDS 或设置权限。"
  - question: "如何设置权限"
    keywords:
      - "设置权限"
      - "提升权限"
      - "授权"
    answer: "普通用户无需预先授权，未配置时默认是 user。发送：设置权限 用户：user_openid 功能：笔记 身份：admin 可允许其修改共享笔记，设为 guest 可禁用对应功能。owner 可设置任意身份；admin 只能在对应功能内设置 user 或 guest。"
  - question: "如何提升权限"
    keywords:
      - "提升权限"
      - "提升笔记权限"
      - "提升部落冲突权限"
    answer: "群聊发送：@机器人 提升笔记权限 @某某，或 @机器人 提升部落冲突权限 @某某。默认 user 由 owner 首次提升会直接成为 admin；功能 admin 只能把显式 guest 恢复为 user。"
  - question: "查询功能列表"
    keywords:
      - "功能列表"
      - "功能翻译"
      - "FEATURE_NAMES_PATH"
    answer: "功能中文名维护在 FEATURE_NAMES_PATH 指向的 YAML 文件中，默认 config/features.yaml。例如 notes 对应笔记，clash 对应部落冲突，wuwa 对应鸣潮；QQ 会话默认使用中文名。"
  - question: "如何查询部落冲突玩家"
    keywords:
      - "部落冲突"
      - "查询玩家"
      - "查看玩家"
      - "clash"
      - "COC"
    answer: "发送：玩家：#ABC123。也可以发送：查询玩家：#ABC123。机器人会查询玩家名、等级、大本营、奖杯、战争星数、部落、捐收兵、英雄、法术、兵种和英雄装备数据；可识别用户默认可以直接查询。"
  - question: "如何查询部落战"
    keywords:
      - "部落战"
      - "当前战争"
      - "查询部落战"
    answer: "发送：部落战：#CLAN1。也可以发送：查询部落战：#CLAN1。机器人会返回当前部落战状态、规模、时间、双方星数、摧毁率和进攻次数；可识别用户默认可以直接查询。"
  - question: "如何查询都城突袭"
    keywords:
      - "都城突袭"
      - "突袭周末"
      - "查询都城"
    answer: "发送：都城：#CLAN1。也可以发送：查询都城突袭：#CLAN1。机器人会返回最近都城突袭赛季状态、时间、都城金币、完成突袭、总进攻次数和参与成员数。"
  - question: "如何查询玩家战斗日志"
    keywords:
      - "战斗日志"
      - "玩家战斗日志"
      - "battlelog"
    answer: "发送：查询玩家战斗日志：#PLAYER1。机器人默认展示最近 5 条战斗记录。"
  - question: "如何查询玩家联赛历史"
    keywords:
      - "联赛历史"
      - "玩家联赛历史"
      - "leaguehistory"
    answer: "发送：查询玩家联赛历史：#PLAYER1。机器人默认展示最近 5 条联赛历史记录。"
  - question: "能否查询建筑剩余时间"
    keywords:
      - "建筑剩余时间"
      - "升级剩余时间"
      - "建筑升级"
    answer: "可以发送：查询建筑剩余时间：#ABC123。但 Clash of Clans 官方 API 当前不返回建筑列表、建筑等级或升级结束时间，机器人只能返回该限制说明，不能给出真实剩余时间。"
  - question: "如何绑定鸣潮"
    keywords:
      - "绑定鸣潮"
      - "鸣潮Token"
      - "库街区token"
    answer: "可识别用户无需预先授权。私聊发送：鸣潮登录：<手机号>，收到短信后发送：鸣潮验证码：<验证码>。机器人会自动绑定默认或唯一角色；触发人机验证时，按回复提示在库街区官方页面或 App 完成验证并获取短信，再回到私聊提交验证码。"
  - question: "如何查询鸣潮玩家"
    keywords:
      - "鸣潮"
      - "鸣潮面板"
      - "鸣潮体力"
      - "鸣潮玩家"
    answer: "绑定鸣潮 Token 和角色后，发送：鸣潮面板 或 鸣潮体力。查询成功后机器人会返回 PNG 图片；图片上传失败时自动回退为文本。可识别用户默认可以使用，显式 guest 会被拒绝。"
  - question: "如何查询鸣潮练度"
    keywords:
      - "鸣潮练度"
      - "角色练度"
    answer: "发送：练度：今汐 查询角色等级、武器、技能和声骸图片。"
  - question: "如何分析鸣潮抽卡"
    keywords:
      - "鸣潮抽卡"
      - "抽卡分析"
      - "唤取记录"
    answer: "先在游戏内打开唤取记录并复制临时 URL，然后发送：导入鸣潮抽卡：<唤取记录URL>。导入后发送：抽卡分析，或：抽卡分析：角色活动。"
  - question: "鸣潮数据隐私"
    keywords:
      - "鸣潮隐私"
      - "token安全"
      - "鸣潮凭据"
    answer: "鸣潮 Token 第一版以本地文件保存到 WUWA_DATA_DIR，不会在普通回复中展示，也不会上传第三方中转服务。请只在可信部署机器上使用。"
